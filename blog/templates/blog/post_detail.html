{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
<article class="post-detail">
  <h2>{{ post.title }}</h2>
  <p class="post-meta">
    by <a href="{% url 'blog:posts_by_author' %}?author={{ post.author.username }}">{{ post.author }}</a>
    on <span class="post-date">{{ post.created_at|date:"Y-m-d" }}</span>
  </p>
  <p class="post-content">{{ post.content|linebreaksbr }}</p>
</article>
{% endblock %}
