{% if posts.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if posts.has_previous %}
    <a href="{% url url_name %}?{{ querystring }}{% if querystring %}&{% endif %}page={{ posts.previous_page_number }}">Previous</a>
  {% endif %}
  <span>Page {{ posts.number }} of {{ posts.paginator.num_pages }}</span>
  {% if posts.has_next %}
    <a href="{% url url_name %}?{{ querystring }}{% if querystring %}&{% endif %}page={{ posts.next_page_number }}">Next</a>
  {% endif %}
</nav>
{% endif %}
